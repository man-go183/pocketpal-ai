name: Build APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Set up JDK 17
        uses: actions/setup-java@v6.0.1
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4.0.4

      - name: Install Android 36 platform
        run: sdkmanager "platforms;android-36"

      - name: Accept SDK licences
        run: yes | sdkmanager --licenses

      - name: Install Gradle 9.8.0 (checksum-verified)
        run: |
          curl -sL https://services.gradle.org/distributions/gradle-9.8.0-bin.zip -o /tmp/gradle.zip
          echo "bafd5ce9cfaea0fbccfdc8439a1ac42fbd4cd9c89dc9a988228d8a2639a58e6c  /tmp/gradle.zip" | sha256sum -c -
          unzip -q /tmp/gradle.zip -d /tmp
          echo "/tmp/gradle-9.8.0/bin" >> "$GITHUB_PATH"

      - name: Build debug APK
        run: gradle assembleDebug --stacktrace --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v7.0.1
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/*.apk